spring.application.name=qaliruta

# ===============================
# Conexión MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/qaliruta_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===============================
# Thymeleaf (desactiva cache en desarrollo)
# ===============================
spring.thymeleaf.cache=false
