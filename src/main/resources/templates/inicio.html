<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/componentes :: head-comun('Inicio - QaliRuta', '/css/inicio.css')}"
  ></head>

  <body>
    <div class="app-container">
      <header
        class="d-flex justify-content-between align-items-center mt-3 mb-4 px-3"
      >
        <div>
          <p class="text-success fw-bold mb-0 small">Bienvenido</p>
          <h2 class="fw-bold mb-0">Hola, José</h2>
          <p class="text-muted small mb-0">¿Qué deseas hacer hoy?</p>
        </div>

        <div class="d-flex align-items-center">
          <i
            class="bi bi-headset text-success fs-3 me-3 cursor-pointer"
            onclick="window.location.href = '/contacto'"
          ></i>
          <div
            class="user-avatar bg-success text-white fw-bold d-flex align-items-center justify-content-center"
          >
            J
          </div>
        </div>
      </header>

      <main>
        <!-- esto funcionara solo si "esOro" es true -->
        <div class="px-3 mb-4" th:if="${esOro}">
          <div
            class="badge-oro rounded-pill py-2 px-3 d-flex align-items-center justify-content-center"
          >
            <i class="bi bi-award-fill text-warning me-2 fs-5"></i>
            <span class="fw-bold text-gold"
              >Distintivo Oro activo · Válido hasta 30 ago</span
            >
          </div>
        </div>

        <div class="px-3 mb-4">
          <h6 class="fw-bold mb-3 section-title">Acciones rápidas</h6>
          <div class="row g-3">
            <div class="col-6">
              <a th:href="@{/menus/nuevo}" class="text-decoration-none">
                <div class="action-card bg-soft-orange text-center">
                  <div class="icon-circle bg-white shadow-sm mb-2 mx-auto">
                    <i class="bi bi-shop text-orange fs-4"></i>
                  </div>
                  <span class="fw-bold small text-orange">Crear Menú</span>
                </div>
              </a>
            </div>

            <div class="col-6">
              <a th:href="@{/menus}" class="text-decoration-none">
                <div class="action-card bg-soft-green text-center">
                  <div class="icon-circle bg-white shadow-sm mb-2 mx-auto">
                    <i class="bi bi-card-list text-success fs-4"></i>
                  </div>
                  <span class="fw-bold small text-success">Ver Menús</span>
                </div>
              </a>
            </div>

            <div class="col-6">
              <a th:href="@{/categorias}" class="text-decoration-none">
                <div class="action-card bg-soft-purple text-center">
                  <div class="icon-circle bg-white shadow-sm mb-2 mx-auto">
                    <i class="bi bi-tags-fill text-purple fs-4"></i>
                  </div>
                  <span class="fw-bold small text-purple">Categorías</span>
                </div>
              </a>
            </div>

            <div class="col-6">
              <div class="action-card bg-soft-yellow text-center">
                <div class="icon-circle bg-white shadow-sm mb-2 mx-auto">
                  <i class="bi bi-trophy-fill text-warning fs-4"></i>
                </div>
                <span class="fw-bold small text-gold">Mi Distintivo</span>
              </div>
            </div>
          </div>
        </div>

        <div class="px-3 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 section-title">Locales cercanos</h6>
            <a href="#" class="text-success text-decoration-none small fw-bold"
              >Ver todos</a
            >
          </div>
          <div class="map-container position-relative">
            <div class="map-bg">
              <div class="map-pin pin-1">
                <i class="bi bi-geo-alt-fill"></i>
              </div>
              <div class="map-pin pin-2">
                <i class="bi bi-geo-alt-fill"></i>
              </div>
              <div class="map-pin pin-3 bg-secondary">
                <i class="bi bi-geo-alt-fill"></i>
              </div>
              <div class="map-pin pin-4">
                <i class="bi bi-geo-alt-fill"></i>
              </div>
            </div>
            <button
              class="btn btn-light btn-sm rounded-pill shadow-sm position-absolute bottom-0 end-0 m-2 text-success fw-bold"
            >
              Ver todos &rarr;
            </button>
          </div>
        </div>

        <div class="px-3 mb-5 pb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 section-title">Menús contra la anemia</h6>
            <a th:href="@{/menus}" class="text-success text-decoration-none small fw-bold"
              >Ver todos</a
            >
          </div>

          <!-- Thymeleaf repetira este bloque por cada menu en la BD -->
          <div
            th:each="menu : ${listaMenus}"
            class="recent-menu-card d-flex align-items-center p-3 mb-3 bg-white"
          >
            <div
              class="menu-icon-box bg-soft-green d-flex justify-content-center align-items-center me-3 flex-shrink-0"
            >
              <i class="bi bi-shop text-success fs-4"></i>
            </div>
            <div class="flex-grow-1 overflow-hidden">
              <h6 class="fw-bold mb-1 menu-title text-truncate" th:text="${menu.nombre}">
                Nombre del menú
              </h6>
              <span class="text-muted small d-flex align-items-center">
                <i class="bi bi-droplet-fill text-danger me-1"></i>
                <span th:text="${menu.contenidoHierro} + ' mg Fe'"></span>
                <span class="mx-1">·</span>
                <span th:text="${menu.categoria.nombre}"></span>
              </span>
            </div>
            <div class="text-end ms-2">
              <span class="fw-bold text-success small">
                S/ <span th:text="${#numbers.formatDecimal(menu.precio, 1, 2)}"></span>
              </span>
            </div>
          </div>
        </div>
      </main>

      <footer
        th:replace="~{fragments/componentes :: footer-nav('inicio')}"
      ></footer>
    </div>
  </body>
</html>
