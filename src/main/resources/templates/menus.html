<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  
  <head
    th:replace="~{fragments/componentes :: head-comun('Menús - QaliRuta', '/css/menus.css')}"
  ></head>

  <body>
    <div class="app-container d-flex flex-column min-vh-100">
      <header class="sticky-top-header px-4 pt-4 pb-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h2 class="fw-bold mb-0 text-dark-blue">Mis Menús</h2>
            <p class="text-muted small mb-0" th:text="${#lists.size(listaMenus)} + ' menús registrados'"></p>
          </div>
          <a th:href="@{/categorias}" class="btn btn-outline-success btn-sm rounded-pill fw-semibold px-3">
            <i class="bi bi-tags me-1"></i> Categorías
          </a>
        </div>
      </header>

      <main class="px-4 flex-grow-1 pb-5 mb-5 menus-main">

        <!-- Mensajes Flash de Notificación -->
        <div th:if="${mensajeExito}" class="alert alert-success d-flex align-items-center justify-content-between fade show rounded-4 py-2 px-3 mb-3 small" role="alert">
          <div class="d-flex align-items-center">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensajeExito}"></span>
          </div>
          <button type="button" class="btn-close ms-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger d-flex align-items-center justify-content-between fade show rounded-4 py-2 px-3 mb-3 small" role="alert">
          <div class="d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
          </div>
          <button type="button" class="btn-close ms-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="menu-list-container mb-4 pb-5">

          <!-- Mensaje si no hay registros -->
          <div th:if="${#lists.isEmpty(listaMenus)}" class="text-center py-5">
            <i class="bi bi-cup-hot empty-state-icon text-muted d-block mb-3"></i>
            <h6 class="fw-bold text-muted">Aún no hay menús registrados</h6>
            <p class="text-muted small">Haz clic en el botón inferior para registrar el primero.</p>
          </div>

          <!-- Listado dinámico desde MySQL (READ) -->
          <div
            th:each="menu : ${listaMenus}"
            class="menu-list-card d-flex align-items-center p-3 mb-3 bg-white"
          >
            <div
              class="menu-icon-bg d-flex justify-content-center align-items-center me-3 flex-shrink-0"
            >
              <i class="bi bi-cup-hot text-danger fs-4"></i>
            </div>
            <div class="flex-grow-1 overflow-hidden">
              <div class="d-flex align-items-center gap-2 mb-1">
                <h6
                  class="fw-bold mb-0 text-dark-blue text-truncate"
                  th:text="${menu.nombre}"
                >
                  Nombre del menú
                </h6>
              </div>

              <div class="mb-1">
                <span class="badge bg-light text-success border border-success-subtle rounded-pill px-2 py-1 small" th:text="${menu.categoria.nombre}">
                  Categoría
                </span>
              </div>

              <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="text-blood-info fw-semibold">
                  <i class="bi bi-droplet-fill"></i>
                  <span th:text="${menu.contenidoHierro} + ' mg Fe'"></span>
                </span>
                <span class="text-price fw-bold">
                  S/ <span th:text="${#numbers.formatDecimal(menu.precio, 1, 2)}"></span>
                </span>
              </div>
            </div>

            <!-- Acciones CRUD: Editar y Eliminar -->
            <div class="d-flex flex-column gap-1 ms-2">
              <a
                th:href="@{/menus/editar/{id}(id=${menu.id})}"
                class="btn btn-light btn-action-circle text-primary"
                title="Editar menú"
              >
                <i class="bi bi-pencil-fill"></i>
              </a>
              <button
                type="button"
                class="btn btn-light btn-action-circle text-danger border-0"
                data-bs-toggle="modal"
                data-bs-target="#modalEliminar"
                th:data-url="@{/menus/eliminar/{id}(id=${menu.id})}"
                th:data-nombre="${menu.nombre}"
                title="Eliminar menú"
              >
                <i class="bi bi-trash-fill"></i>
              </button>
            </div>
          </div>

        </div>
      </main>

      <div class="create-menu-btn-container px-4">
        <a
          th:href="@{/menus/nuevo}"
          class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow-sm fs-6"
        >
          + Crear nuevo menú
        </a>
      </div>

      <footer
        th:replace="~{fragments/componentes :: footer-nav('menus')}"
      ></footer>
    </div>

    <!-- Modal de Confirmación para Eliminar Menú -->
    <div
      class="modal fade"
      id="modalEliminar"
      tabindex="-1"
      aria-labelledby="modalEliminarLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-confirm-dialog px-3">
        <div class="modal-content rounded-4 border-0 shadow text-center p-3">
          <div class="modal-body pb-2 pt-3">
            <div
              class="mx-auto mb-3 bg-danger-subtle text-danger rounded-circle d-flex align-items-center justify-content-center"
              style="width: 52px; height: 52px;"
            >
              <i class="bi bi-trash3-fill fs-4"></i>
            </div>
            <h6 class="fw-bold text-dark mb-2" id="modalEliminarLabel">¿Eliminar menú?</h6>
            <p class="text-muted small mb-0">
              ¿Estás seguro de que deseas eliminar <strong id="nombreElementoEliminar" class="text-dark">este menú</strong>? Esta acción no se puede deshacer.
            </p>
          </div>
          <div class="modal-footer border-0 pt-3 pb-1 justify-content-center gap-2">
            <button
              type="button"
              class="btn btn-light rounded-pill px-4 fw-semibold small"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <a
              id="btnConfirmarEliminar"
              href="#"
              class="btn btn-danger rounded-pill px-4 fw-semibold small shadow-sm"
            >
              Sí, eliminar
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const modalEliminar = document.getElementById('modalEliminar');
      if (modalEliminar) {
        modalEliminar.addEventListener('show.bs.modal', function (event) {
          const button = event.relatedTarget;
          const url = button.getAttribute('data-url');
          const nombre = button.getAttribute('data-nombre');
          const btnConfirmar = document.getElementById('btnConfirmarEliminar');
          const spanNombre = document.getElementById('nombreElementoEliminar');
          if (btnConfirmar) btnConfirmar.setAttribute('href', url);
          if (spanNombre && nombre) spanNombre.textContent = '"' + nombre + '"';
        });
      }
    </script>
  </body>
</html>
