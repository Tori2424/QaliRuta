<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head
  th:replace="~{fragments/componentes :: head-comun('QaliRuta - Bienvenida', '/css/bienvenida.css')}"
></head>

<body>
    <div class="app-container welcome-screen d-flex flex-column justify-content-between min-vh-100">
        
        <header class="top-spacer pt-5"></header>

       <!-- Cuerpo con carrusel con framework  -->
        <main class="main-content text-center px-4 w-100">
            <div id="onboardingCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" data-bs-pause="false">
                
                <div class="carousel-indicators onboarding-indicators">
                    <button type="button" data-bs-target="#onboardingCarousel" data-bs-slide-to="0" class="active bg-success"></button>
                    <button type="button" data-bs-target="#onboardingCarousel" data-bs-slide-to="1" class="bg-success"></button>
                    <button type="button" data-bs-target="#onboardingCarousel" data-bs-slide-to="2" class="bg-success"></button>
                </div>

                <div class="carousel-inner pb-4">
                    
                    <!-- Slide 1 -->
                    <div class="carousel-item active" data-bs-interval="3000">
                        <img src="/imagenes/login.png" alt="Mercados QaliRuta" class="img-fluid rounded-4 mb-4 shadow-sm mx-auto d-block onboarding-box">
                        <h1 class="fw-bold d-flex align-items-center justify-content-center mb-3 logo-title">
                            <span class="bg-success text-white rounded-3 d-flex align-items-center justify-content-center me-2 logo-icon-box">Q</span>
                            <span class="text-success">Qali</span><span class="text-orange">Ruta</span>
                        </h1>
                        <p class="text-muted small mb-0 px-3">Menús nutritivos, seguros y al alcance de todos</p>
                    </div>

                    <!-- Slide 2 -->
                    <div class="carousel-item" data-bs-interval="3000">
                        <div class="d-flex align-items-center justify-content-center mb-4 mx-auto shadow-sm rounded-4 onboarding-box bg-slide-green">
                            <i class="bi bi-award-fill text-success onboarding-icon"></i>
                        </div>
                        <h2 class="fw-bold mb-3 fs-3 text-success">Gana Distintivos</h2>
                        <p class="text-muted small mb-0 px-3">Mejora la calidad de tus menús y sube de categoría</p>
                    </div>

                    <!-- Slide 3-->
                    <div class="carousel-item" data-bs-interval="3000">
                        <div class="d-flex align-items-center justify-content-center mb-4 mx-auto shadow-sm rounded-4 onboarding-box bg-slide-orange">
                            <i class="bi bi-geo-alt-fill text-orange onboarding-icon"></i>
                        </div>
                        <h2 class="fw-bold mb-3 fs-3 text-orange">Encuentra Locales</h2>
                        <p class="text-muted small mb-0 px-3">Ubica rápidamente los mejores puntos de venta cercanos</p>
                    </div>

                </div>
            </div>
        </main>

        <footer class="bottom-actions px-4 pb-5 pt-4 text-center">
            <a href="/login" class="btn btn-success w-100 rounded-pill py-3 fw-bold mb-3 shadow-sm fs-6">Comenzar</a>
            <a href="/login" class="text-muted text-decoration-none small fw-semibold">Explorar sin cuenta</a>
        </footer>

    </div>

    <!-- Carrusel con Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
