<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayuda y Soporte - QaliRuta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/contacto.css" />
  </head>
  <body>
    <div class="app-container">
      
      <header
        class="contacto-header d-flex align-items-center px-3 py-3 sticky-top"
      >
        <div
          class="cursor-pointer d-flex align-items-center justify-content-center"
          onclick="window.history.back()"
          style="width: 40px; height: 40px"
        >
          <i class="bi bi-chevron-left fs-5 text-dark"></i>
        </div>
        <h1 class="fs-6 fw-bold mb-0 ms-2 text-dark">Ayuda y soporte</h1>
      </header>

      <!-- Formulario de Contacto -->
      <main class="contacto-main bg-white px-4 pt-4">

        <div class="text-center mb-4 mt-2">
          <div class="contacto-icon-box mx-auto mb-3">
            <i class="bi bi-headset text-danger" style="font-size: 2rem"></i>
          </div>
          <h2 class="fs-5 fw-bold text-dark">¿Cómo podemos ayudarte?</h2>
          <p class="text-muted small">
            Envíanos tus dudas o reportes y nuestro equipo se contactará contigo
            a la brevedad.
          </p>
        </div>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="asunto" class="form-label form-label-custom"
              >Asunto</label
            >
            <select
              class="form-select form-control-custom"
              id="asunto"
              required
            >
              <option value="" selected disabled>Selecciona un tema...</option>
              <option value="1">Problemas con mi cuenta</option>
              <option value="2">Dudas sobre un menú o curso</option>
              <option value="3">Reportar un error en la app</option>
              <option value="4">Otro</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="correo" class="form-label form-label-custom"
              >Correo electrónico</label
            >
            <input
              type="email"
              class="form-control form-control-custom"
              id="correo"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="mb-4">
            <label for="mensaje" class="form-label form-label-custom"
              >Mensaje detallado</label
            >
            <textarea
              class="form-control form-control-custom"
              id="mensaje"
              rows="5"
              placeholder="Escribe aquí tu consulta o problema..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-enviar mt-2 shadow-sm">
            Enviar mensaje
          </button>
        </form>
      </main>

      <footer
        class="bottom-nav bg-white d-flex justify-content-between align-items-center px-4 py-2"
      >
        <div
          class="nav-item text-center text-muted cursor-pointer"
          onclick="window.location.href = '/inicio'"
        >
          <i class="bi bi-house-door fs-5"></i>
          <div>Inicio</div>
        </div>
        <div
          class="nav-item text-center text-muted cursor-pointer"
          onclick="window.location.href = '/menus'"
        >
          <i class="bi bi-shop fs-5"></i>
          <div>Menús</div>
        </div>
        <div
          class="nav-item text-center text-muted cursor-pointer"
          onclick="window.location.href = '/mapa'"
        >
          <i class="bi bi-geo-alt fs-5"></i>
          <div>Mapa</div>
        </div>
        <div
          class="nav-item text-center text-muted cursor-pointer"
          onclick="window.location.href = '/cursos'"
        >
          <i class="bi bi-journal-bookmark fs-5"></i>
          <div>Cursos</div>
        </div>
        <div
          class="nav-item text-center text-muted cursor-pointer"
          onclick="window.location.href = '/perfil'"
        >
          <i class="bi bi-person fs-5"></i>
          <div>Perfil</div>
        </div>
      </footer>
    </div>
  </body>
</html>
