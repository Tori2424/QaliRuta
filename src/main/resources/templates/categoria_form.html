<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/componentes :: head-comun(${modoEdicion} ? 'QaliRuta - Editar Categoría' : 'QaliRuta - Nueva Categoría', 'ninguno')}"
  ></head>

  <body>
    <div class="app-container d-flex flex-column min-vh-100">
      <header class="bg-white px-4 pt-4 pb-3 border-bottom">
        <a th:href="@{/categorias}" class="text-success text-decoration-none small fw-semibold d-inline-block mb-2">
          ← Volver a Categorías
        </a>
        <h2 class="fw-bold mb-1 text-dark" th:text="${modoEdicion} ? 'Editar Categoría' : 'Nueva Categoría'">Nueva Categoría</h2>
        <p class="text-muted small mb-0">Organización de grupos de alimentos nutritivos</p>
      </header>

      <main class="px-4 flex-grow-1 py-4 mb-5">
        <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
          
          <!-- ID oculto para edición -->
          <input type="hidden" th:field="*{id}" />

          <!-- Campo Nombre -->
          <div class="mb-3">
            <label class="form-label text-secondary fw-semibold small">NOMBRE DE LA CATEGORÍA *</label>
            <input
              type="text"
              th:field="*{nombre}"
              class="form-control rounded-3 p-3"
              th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
              placeholder="Ej. Ricos en Hierro Hemínico"
            />
            <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
          </div>

          <!-- Campo Descripción -->
          <div class="mb-4">
            <label class="form-label text-secondary fw-semibold small">DESCRIPCIÓN *</label>
            <textarea
              th:field="*{descripcion}"
              rows="4"
              class="form-control rounded-3 p-3"
              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
              placeholder="Describe las propiedades nutricionales de este grupo..."
            ></textarea>
            <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
          </div>

          <!-- Botón de acción -->
          <button
            type="submit"
            class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow-sm"
            th:text="${modoEdicion} ? '✓ Actualizar Categoría' : '+ Guardar Categoría'"
          >
            Guardar Categoría
          </button>
        </form>
      </main>

      <footer
        th:replace="~{fragments/componentes :: footer-nav('menus')}"
      ></footer>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
