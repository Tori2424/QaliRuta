<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head-comun(titulo, cssPropio)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">QaliRuta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    
    <!-- css especifico, solo renderiza si le enviamos un archivo -->
    <link th:if="${cssPropio != 'ninguno'}" rel="stylesheet" th:href="${cssPropio}">
</head>
<body>

    <!-- Fragmento 2: Barra inferior -->
    <footer th:fragment="footer-nav(paginaActiva)" class="bottom-nav bg-white d-flex justify-content-between align-items-center px-4 py-2">
        
        <div th:class="'nav-item text-center cursor-pointer ' + (${paginaActiva == 'inicio'} ? 'active text-success' : 'text-muted')" onclick="window.location.href = '/inicio'">
            <i class="bi bi-house-door fs-5"></i>
            <div>Inicio</div>
        </div>
        
        <div th:class="'nav-item text-center cursor-pointer ' + (${paginaActiva == 'menus'} ? 'active text-success' : 'text-muted')" onclick="window.location.href = '/menus'">
            <i class="bi bi-shop fs-5"></i>
            <div>Menús</div>
        </div>
        
        <div th:class="'nav-item text-center cursor-pointer ' + (${paginaActiva == 'mapa'} ? 'active text-success' : 'text-muted')" onclick="window.location.href = '/mapa'">
            <i class="bi bi-geo-alt fs-5"></i>
            <div>Mapa</div>
        </div>
        
        <div th:class="'nav-item text-center cursor-pointer ' + (${paginaActiva == 'cursos'} ? 'active text-success' : 'text-muted')" onclick="window.location.href = '/cursos'">
            <i class="bi bi-journal-bookmark fs-5"></i>
            <div>Cursos</div>
        </div>
        
        <div th:class="'nav-item text-center cursor-pointer ' + (${paginaActiva == 'perfil'} ? 'active text-success' : 'text-muted')" onclick="window.location.href = '/perfil'">
            <i th:class="'bi fs-5 ' + (${paginaActiva == 'perfil'} ? 'bi-person-fill' : 'bi-person')"></i>
            <div>Perfil</div>
        </div>
        
    </footer>

</body>
</html>
