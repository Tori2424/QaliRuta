<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/componentes :: head-comun(${modoEdicion} ? 'QaliRuta - Editar Menú' : 'QaliRuta - Crear Menú', '/css/crear_menu.css')}"
  ></head>

  <body>
    <div class="app-container d-flex flex-column min-vh-100 position-relative">
      <header class="sticky-top-header px-4 pt-4 pb-2">
        <a th:href="@{/menus}" class="back-link d-inline-block mb-3">← Volver a menús</a>
        <h2 class="fw-bold mb-1 text-dark" th:text="${modoEdicion} ? 'Editar Menú' : 'Crear Menú'">Crear Menú</h2>
        <p class="text-muted small mb-0" th:text="${modoEdicion} ? 'Actualiza los datos del menú nutritivo' : 'Registra un menú balanceado contra la anemia'"></p>
      </header>

      <main class="px-4 crear-menu-main">
        <form th:action="@{/menus/guardar}" th:object="${menu}" method="post" id="formMenu">
          
          <!-- ID oculto para la actualización (UPDATE) -->
          <input type="hidden" th:field="*{id}" />

          <!-- Campo 1: Nombre -->
          <div class="mb-3">
            <label class="form-label-custom">NOMBRE DEL MENÚ *</label>
            <input
              type="text"
              th:field="*{nombre}"
              class="form-control input-custom"
              th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
              placeholder="Ej. Sangrecita con ensalada fresca"
            />
            <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
          </div>

          <!-- Campo 2: Categoría (Relación FK) -->
          <div class="mb-3">
            <label class="form-label-custom">CATEGORÍA NUTRICIONAL *</label>
            <select
              th:field="*{categoria.id}"
              class="form-select input-custom"
              th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid' : ''"
            >
              <option value="" disabled selected>-- Seleccione una categoría --</option>
              <option
                th:each="cat : ${listaCategorias}"
                th:value="${cat.id}"
                th:text="${cat.nombre}"
              ></option>
            </select>
            <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
          </div>

          <div class="row g-2 mb-3">
            <!-- Campo 3: Precio -->
            <div class="col-6">
              <label class="form-label-custom">PRECIO (S/) *</label>
              <input
                type="number"
                step="0.10"
                min="0.50"
                th:field="*{precio}"
                class="form-control input-custom"
                th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''"
                placeholder="0.00"
              />
              <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <!-- Campo 4: Hierro (No editable, autocalculado por ingredientes) -->
            <div class="col-6">
              <label class="form-label-custom">HIERRO (mg Fe) *</label>
              <input
                type="number"
                step="0.1"
                min="0.1"
                id="inputHierro"
                th:field="*{contenidoHierro}"
                class="form-control input-custom bg-light"
                th:classappend="${#fields.hasErrors('contenidoHierro')} ? 'is-invalid' : ''"
                readonly
                placeholder="Automático"
              />
              <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('contenidoHierro')}" th:errors="*{contenidoHierro}"></div>
            </div>
          </div>

          <!-- Campo 5: Descripción / Ingredientes -->
          <div class="mb-4">
            <label class="form-label-custom">DESCRIPCIÓN / INGREDIENTES *</label>
            <textarea
              th:field="*{descripcion}"
              rows="3"
              class="form-control input-custom"
              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
              placeholder="Detalla los alimentos e ingredientes principales de este menú..."
            ></textarea>
            <div class="invalid-feedback d-block text-danger small mt-1" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
          </div>

          <!-- Sección visual interactiva de ingredientes desde la Base de Datos -->
          <label id="contador-ingredientes" class="form-label-custom mb-2 d-block text-muted"
            >SUGERENCIAS RICAS EN HIERRO (CLICK PARA SELECCIONAR)</label
          >

          <div class="d-flex flex-column gap-2 mb-4">
            <div
              th:each="ing : ${listaIngredientes}"
              class="ingredient-card"
              th:classappend="${menu.tieneIngrediente(ing.id)} ? 'selected' : ''"
              th:attr="data-id=${ing.id},data-nombre=${ing.nombre},data-hierro=${ing.contenidoHierro}"
            >
              <!-- Checkbox oculto para binding con Spring MVC -->
              <input
                type="checkbox"
                name="ingredientes"
                th:value="${ing.id}"
                th:checked="${menu.tieneIngrediente(ing.id)}"
                class="d-none ingredient-checkbox"
              />
              <div class="ingredient-left">
                <div class="check-circle"><i class="bi bi-check"></i></div>
                <p class="ingredient-name" th:text="${ing.nombre}">Nombre de ingrediente</p>
              </div>
              <div class="iron-info">
                <i class="bi bi-droplet-fill text-danger me-1"></i>
                <span th:text="${ing.contenidoHierro} + ' mg'">0.0 mg</span>
              </div>
            </div>
          </div>

          <!-- Botón flotante para Guardar -->
          <div class="calc-btn-container px-4">
            <button
              type="submit"
              class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow-sm fs-6 text-white"
              th:text="${modoEdicion} ? '✓ Actualizar Menú' : '+ Guardar Menú'"
            >
              Guardar Menú
            </button>
          </div>
        </form>
      </main>

      <footer
        th:replace="~{fragments/componentes :: footer-nav('menus')}"
      ></footer>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/crear_menu.js"></script>
  </body>
</html>
