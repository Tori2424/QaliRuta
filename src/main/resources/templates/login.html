<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QaliRuta - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/login.css" rel="stylesheet" />
  </head>

  <body>
    <div
      class="app-container login-screen d-flex flex-column justify-content-between min-vh-100"
    >
      <header class="login-header-bg text-center pt-4 pb-3">
        <img
          src="/imagenes/login.png"
          alt="Ilustración Bienvenida"
          class="img-fluid rounded-4 mx-auto d-block"
          style="max-width: 280px"
        />
      </header>

      <main class="px-4 py-3 flex-grow-1">
        <h3 class="fw-bold mb-1">Bienvenido de vuelta 👋</h3>
        <p class="text-muted small mb-4">Ingresa a tu cuenta para continuar</p>

        <form>
          <div class="mb-3">
            <label
              class="form-label text-secondary fw-semibold small tracking-wide"
              >CORREO ELECTRÓNICO</label
            >
            <div class="input-group custom-input-group">
              <span
                class="input-group-text bg-white border-end-0 text-muted ps-3"
              >
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="email"
                class="form-control border-start-0 ps-2"
                placeholder="ejemplo@correo.com"
              />
            </div>
          </div>

          <div class="mb-2">
            <label
              class="form-label text-secondary fw-semibold small tracking-wide"
              >CONTRASEÑA</label
            >
            <div class="input-group custom-input-group">
              <span
                class="input-group-text bg-white border-end-0 text-muted ps-3"
              >
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="password"
                id="passwordInput"
                class="form-control border-start-0 border-end-0 ps-2"
                placeholder="••••••••••"
              />
              <span
                class="input-group-text bg-white border-start-0 text-muted pe-3"
                id="togglePassword"
                style="cursor: pointer"
              >
                <i class="bi bi-eye" id="eyeIcon"></i>
              </span>
            </div>
          </div>

          <div class="text-end mb-4">
            <a
              href="#"
              class="text-success text-decoration-none small fw-semibold"
              data-bs-toggle="modal"
              data-bs-target="#modalRecuperar"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <a
            href="/inicio"
            class="btn btn-success w-100 rounded-pill py-3 fw-bold mb-3 shadow-sm"
            >Ingresar</a
          >
        </form>
      </main>

      <footer class="text-center pb-4">
        <span class="text-muted small">¿No tienes cuenta? </span>
        <a href="#" class="text-success text-decoration-none small fw-bold"
          >Regístrate</a
        >
      </footer>
    </div>

    <!-- Recuperar Contraseña  -->
    <div
      class="modal fade"
      id="modalRecuperar"
      tabindex="-1"
      aria-labelledby="modalRecuperarLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered px-3">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="modalRecuperarLabel">
              Recuperar Contraseña
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small mb-3">
              Ingresa tu correo registrado para enviarte un enlace de
              recuperación.
            </p>
            <div class="input-group custom-input-group mb-3">
              <span
                class="input-group-text bg-white border-end-0 text-muted ps-3"
              >
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="email"
                class="form-control border-start-0 ps-2"
                placeholder="ejemplo@correo.com"
              />
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-light rounded-pill px-3"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-success rounded-pill px-4"
              data-bs-dismiss="modal"
            >
              Enviar enlace
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/login.js"></script>
    
  </body>
</html>
